<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Kanban Board</h1>
    <form id="todo-form" class="new-task-form">
        <input type="text" id="new-task" placeholder="Add a new task" required>
        <button type="submit">Add Task</button>
    </form>
    <div id="board" class="board">
        <section class="column" data-status="todo">
            <h2>To Do</h2>
            <ul class="task-list" id="todo-list"></ul>
        </section>
        <section class="column" data-status="progress">
            <h2>In Progress</h2>
            <ul class="task-list" id="progress-list"></ul>
        </section>
        <section class="column" data-status="done">
            <h2>Done</h2>
            <ul class="task-list" id="done-list"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
