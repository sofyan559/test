name: Package EG Arduino Simulator

on:
  pull_request:
    branches: [main]
    paths:
      - 'eg-arduino-simulator/**'
      - '.github/workflows/package-egas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Validate PHP
        run: php -l eg-arduino-simulator/eg-arduino-simulator.php

      - name: Validate JavaScript
        run: |
          node --check eg-arduino-simulator/assets/js/catalog.js
          node --check eg-arduino-simulator/assets/js/app.js

      - name: Audit catalog and layer order
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalog = fs.readFileSync('eg-arduino-simulator/assets/js/catalog.js', 'utf8');
          const php = fs.readFileSync('eg-arduino-simulator/eg-arduino-simulator.php', 'utf8');
          const css = fs.readFileSync('eg-arduino-simulator/assets/css/app.css', 'utf8');
          const allSources = `${catalog}\n${php}`;
          const required = [
            'Wokwi-Chip-L298N',
            'Wokwi-Chip-TB6612FNG',
            'Wokwi-Chip-stepper-esc',
            'wokwi-bme280-custom-chip',
            'wokwi-aht25-custom-chip',
            'wokwi-ds1820-custom-chip',
            'Half_breadboard_v2.fzp',
            'HC-05-male_fix.fzp',
            'NRF24L01_fix.fzp'
          ];
          for (const item of required) {
            if (!allSources.includes(item)) throw new Error(`Missing component source: ${item}`);
          }
          const fritzingCount = (catalog.match(/fritzing\('/g) || []).length - 1;
          const customCount = (catalog.match(/custom\('/g) || []).length - 1;
          if (fritzingCount < 20) throw new Error(`Only ${fritzingCount} Fritzing components`);
          if (customCount < 10) throw new Error(`Only ${customCount} community custom chips`);
          if (!css.includes('.egas-wire-layer { z-index: 20')) throw new Error('Wire layer is not above artwork');
          if (!css.includes('.egas-pin-layer { z-index: 30')) throw new Error('Pin layer is not above wires');
          console.log({fritzingCount, customCount});
          NODE

      - name: Build WordPress plugin ZIP
        run: |
          mkdir -p dist releases
          zip -qr dist/eg-arduino-simulator-v2.0.8-real-custom-chips.zip eg-arduino-simulator
          cp dist/eg-arduino-simulator-v2.0.8-real-custom-chips.zip releases/
          unzip -t dist/eg-arduino-simulator-v2.0.8-real-custom-chips.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: eg-arduino-simulator-v2.0.8
          path: dist/eg-arduino-simulator-v2.0.8-real-custom-chips.zip
          if-no-files-found: error
          retention-days: 14

      - name: Commit packaged ZIP to branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "EGAS Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add releases/eg-arduino-simulator-v2.0.8-real-custom-chips.zip
          git diff --cached --quiet || git commit -m "Build EG Arduino Simulator v2.0.8 ZIP"
          git push origin HEAD:${{ github.head_ref }}
